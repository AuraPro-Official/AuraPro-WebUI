name: Release to PyPI

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aurapro-webui/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Git
        run: sudo apt-get update && sudo apt-get install -y git
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel .
          ls -lh dist
      - name: Validate wheel contents
        run: |
          python -c "from pathlib import Path; import zipfile; wheel = next(Path('dist').glob('*.whl')); names = set(zipfile.ZipFile(wheel).namelist()); required = {'open_webui/env.py', 'open_webui/migrations/env.py'}; missing = required - names; assert not missing, f'Missing required wheel files: {sorted(missing)}'"
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
