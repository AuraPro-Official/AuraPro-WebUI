name: Release to PyPI

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aurapro-webui/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Git
        run: sudo apt-get update && sudo apt-get install -y git
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: 3.11
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --wheel .
          ls -lh dist
      - name: Validate wheel contents
        run: |
          python -c "from pathlib import Path; import zipfile; wheel = next(Path('dist').glob('*.whl')); names = set(zipfile.ZipFile(wheel).namelist()); required = {'open_webui/env.py', 'open_webui/migrations/env.py'}; missing = required - names; assert not missing, f'Missing required wheel files: {sorted(missing)}'"
      - name: Validate desktop platform dependencies
        run: |
          pip install uv
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          # Windows ARM runs the complete x64 Python stack through Windows 11 emulation.
          # Native runtime packages must never fall back to compiling on an end-user machine.
          native_wheels="brotli,brotlicffi,onnxruntime,opencv-python"
          uv pip install --dry-run --system --only-binary "$native_wheels" --python-platform x86_64-pc-windows-msvc --python-version 3.12 "$wheel"
          uv pip install --dry-run --system --only-binary "$native_wheels" --python-platform x86_64-apple-darwin --python-version 3.12 "$wheel"
          uv pip install --dry-run --system --only-binary "$native_wheels" --python-platform aarch64-apple-darwin --python-version 3.12 "$wheel"
          uv pip install --dry-run --system --only-binary "$native_wheels" --python-platform x86_64-unknown-linux-gnu --python-version 3.12 "$wheel"
          uv pip install --dry-run --system --only-binary "$native_wheels" --python-platform aarch64-unknown-linux-gnu --python-version 3.12 "$wheel"
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
